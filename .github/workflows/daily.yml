name: 每日精选

on:
  schedule:
    - cron: '0 22 * * *'   # 每天 06:00 北京时间（GitHub cron 是 UTC 时间）
  push:
    branches: [main]
    paths-ignore: ['daily/**', 'README.md']   # 自动生成的日报回推时不重复触发
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r scripts/requirements.txt

      - name: 生成每日精选
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/build_digest.py

      - name: 提交并推送
        run: |
          git config user.name "daily-reads[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily README.md
          if ! git diff --cached --quiet; then
            git commit -m "📰 每日精选 $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "没有变更，跳过提交"
          fi
